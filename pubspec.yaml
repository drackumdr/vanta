name: vanta
description: "VANTA - Professional local surveillance viewer. Ultralight Hikvision ISAPI client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  crypto: ^3.0.6
  provider: ^6.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  uuid: ^4.5.1
  xml: ^6.5.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
