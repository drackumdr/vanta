workflows:
  macos-dmg:
    name: VANTA macOS (dmg sin firmar)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Analizar
        script: flutter analyze
      - name: Tests
        script: flutter test
      - name: Build macOS (sin firma)
        script: |
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY=""
          export FLUTTER_XCODE_CODE_SIGNING_REQUIRED="NO"
          export FLUTTER_XCODE_CODE_SIGNING_ALLOWED="NO"
          flutter build macos --release
      - name: Empaquetar .dmg
        script: |
          APP=build/macos/Build/Products/Release/vanta.app
          STAGE=build/dmg && rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname VANTA -srcfolder "$STAGE" -ov -format UDZO build/VANTA.dmg
    artifacts:
      - build/VANTA.dmg
      - build/macos/Build/Products/Release/*.app
