name: Build macOS (VANTA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar para macOS (Release)
        run: flutter build macos --release

      - name: Empaquetar aplicación (.zip)
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent vanta.app ../../../../../vanta-macos.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vanta-macos
          path: vanta-macos.zip
          retention-days: 14
